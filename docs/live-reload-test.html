<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NTranslate: Live Reload Test</title>
  <style>
    body {
      margin: 0;
      padding: 40px;
      background: #0f1115;
      color: #e6e9ef;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 80vh;
    }
    .card {
      background: #181b22;
      border: 1px solid #282d37;
      border-radius: 12px;
      padding: 28px 36px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
      text-align: center;
      max-width: 480px;
    }
    h1 {
      margin: 0 0 12px;
      font-size: 24px;
      color: #4c8dff;
    }
    p {
      color: #9aa3b2;
      line-height: 1.6;
      margin: 0 0 20px;
    }
    .badge {
      display: inline-block;
      padding: 6px 14px;
      background: rgba(76, 141, 255, 0.15);
      color: #4c8dff;
      border-radius: 99px;
      font-size: 13px;
      font-weight: 600;
    }
    .time {
      margin-top: 18px;
      font-size: 12px;
      color: #647087;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="badge" style="background: rgba(40, 200, 64, 0.15); color: #28c840;">Cập nhật thành công!</div>
    <h1>NTranslate Test Page</h1>
    <p>File HTML mẫu thử nghiệm tính năng tự động reload trên Chrome.</p>
    <div style="background: #11141a; border: 1px dashed #4c8dff; border-radius: 8px; padding: 14px; margin-bottom: 20px;">
      <strong style="color: #ffb020;">Vừa thêm nội dung mới lúc:</strong>
      <div style="font-size: 16px; margin-top: 6px; color: #fff;">2026-08-31 16:45:00</div>
    </div>
    <div style="background: rgba(255, 176, 32, 0.1); border: 1px solid rgba(255, 176, 32, 0.3); border-radius: 8px; padding: 12px; margin-bottom: 20px; color: #ffb020; font-size: 13px;">
      + Thêm block kiểm tra lần 2: Hot reload hoạt động mượt mà!
    </div>
    <div class="time">Trạng thái: Đã đồng bộ lần 2</div>
  </div>
</body>
</html>
