<h1>NTranslate — chú thích tên biến trên giao diện thật</h1>
<p>Dòng xanh là tên biến trong <code>Sources/translate/</code>, dòng dưới là chức năng hoặc selector. Bảng đầy đủ: <a href="ntranslate-ui-naming.html">ntranslate-ui-naming.html</a>. Rê chuột lên một dây để xem nhanh; bấm để ghim (bấm lại, bấm ra nền hoặc Esc để bỏ ghim).</p>

<script>
const map = document.getElementById('map');
map.addEventListener('click', e => {
  const cal = e.target.closest('.cal');
  const wasOn = cal && cal.classList.contains('on');
  map.querySelectorAll('.cal.on').forEach(n => n.classList.remove('on'));
  if (cal && !wasOn) cal.classList.add('on');
  map.classList.toggle('locked', !!map.querySelector('.cal.on'));
});
document.addEventListener('keydown', e => {
  if (e.key !== 'Escape') return;
  map.querySelectorAll('.cal.on').forEach(n => n.classList.remove('on'));
  map.classList.remove('locked');
});
</script>
