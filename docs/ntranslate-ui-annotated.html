<script>
const map = document.getElementById('map');
map.addEventListener('click', e => {
  const cal = e.target.closest('.cal');
  const wasOn = cal && cal.classList.contains('on');
  map.querySelectorAll('.cal.on').forEach(n => n.classList.remove('on'));
  if (cal && !wasOn) cal.classList.add('on');
  map.classList.toggle('locked', !!map.querySelector('.cal.on'));
});
document.addEventListener('keydown', e => {
  if (e.key !== 'Escape') return;
  map.querySelectorAll('.cal.on').forEach(n => n.classList.remove('on'));
  map.classList.remove('locked');
});
</script>
