name: Windows Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Semantic version (e.g. 1.2.3)'
        required: true

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set version
        id: version
        shell: pwsh
        run: |
          if ('${{ github.event_name }}' -eq 'release') {
            $v = '${{ github.event.release.tag_name }}' -replace '^v', ''
          } else {
            $v = '${{ inputs.version }}'
          }
          if ($v -notmatch '^\d+\.\d+\.\d+$') { throw "Invalid version: $v" }
          echo "VERSION=$v" >> $env:GITHUB_OUTPUT

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.301'

      - name: Install Inno Setup
        shell: pwsh
        run: winget install --id JRSoftware.InnoSetup -e --silent --accept-package-agreements --accept-source-agreements

      - name: Restore (locked)
        shell: pwsh
        run: dotnet restore windows/NTranslate.slnx --locked-mode

      - name: Build
        shell: pwsh
        run: dotnet build windows/NTranslate.slnx -c Release --no-restore

      - name: Test
        shell: pwsh
        run: dotnet test windows/NTranslate.slnx -c Release --no-build --no-restore

      - name: Publish app
        shell: pwsh
        run: |
          dotnet publish windows/src/NTranslate.App/NTranslate.App.csproj -c Release -r win-x64 --no-restore -o windows/artifacts/publish/win-x64

      - name: Run script tests
        shell: pwsh
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File windows/packaging/scripts/Invoke-ScriptTests.ps1

      - name: Compile installer with ISCC
        shell: pwsh
        run: |
          $ver = '${{ steps.version.outputs.VERSION }}'
          $iscc = 'C:\Users\runneradmin\AppData\Local\Programs\Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) { $iscc = (Get-Command ISCC.exe -ErrorAction SilentlyContinue)?.Source }
          if (-not $iscc) { $iscc = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe' }
          $src = "$env:GITHUB_WORKSPACE\windows\artifacts\publish\win-x64"
          $out = "$env:GITHUB_WORKSPACE\windows\artifacts\packages"
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          & $iscc "/DAppVersion=$ver" "/DSourceDir=$src" "/DOutputDir=$out" "$env:GITHUB_WORKSPACE\windows\packaging\NTranslate.iss"
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed with exit code $LASTEXITCODE" }

      - name: Generate SHA-256 sidecar
        shell: pwsh
        run: |
          $ver = '${{ steps.version.outputs.VERSION }}'
          $name = "NTranslate-$ver-win-x64-setup.exe"
          $exe  = "windows/artifacts/packages/$name"
          $hash = (Get-FileHash -LiteralPath $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content -LiteralPath "$exe.sha256" -Encoding ASCII -Value "$hash *$name"
          Write-Output "sha256: $hash"

      - name: Upload release assets
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            windows/artifacts/packages/NTranslate-${{ steps.version.outputs.VERSION }}-win-x64-setup.exe
            windows/artifacts/packages/NTranslate-${{ steps.version.outputs.VERSION }}-win-x64-setup.exe.sha256

      - name: Upload workflow artifacts (manual dispatch)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: NTranslate-${{ steps.version.outputs.VERSION }}-win-x64
          path: |
            windows/artifacts/packages/NTranslate-${{ steps.version.outputs.VERSION }}-win-x64-setup.exe
            windows/artifacts/packages/NTranslate-${{ steps.version.outputs.VERSION }}-win-x64-setup.exe.sha256
